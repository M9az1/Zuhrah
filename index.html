<style>
  :root {
    /* Rose-gold palette pulled from the logo */
    --rg-light:    #e8b9a3;
    --rg-mid:      #c08770;
    --rg-deep:     #a86954;
    --rg-shadow:   #8a5240;

    /* Soft cream backgrounds */
    --cream-1:     #fdf8f4;
    --cream-2:     #f7ede4;
    --cream-3:     #f0e0d2;
    --blush:       #ead4c4;

    /* Ink for text */
    --ink:         #2a1f1a;
    --ink-soft:    #5c4438;
    --ink-muted:   #8a7166;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    color: var(--ink);
    background:
      radial-gradient(ellipse at top left,    rgba(232,185,163,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(192,135,112,0.25) 0%, transparent 55%),
      radial-gradient(ellipse at center,       rgba(253,248,244,1)    0%, transparent 70%),
      linear-gradient(135deg, #fdf8f4 0%, #f0e0d2 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* Subtle paper-grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(192,135,112,0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168,105,84,0.05) 0%, transparent 40%);
    z-index: 0;
  }

  /* Scattered rose-gold dot particles like the logo */
  .particle {
    position: fixed;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rg-light), var(--rg-mid));
    pointer-events: none;
    z-index: 1;
    animation: drift 20s ease-in-out infinite;
  }
  .p1  { top: 8%;  left: 12%; width: 5px;  height: 5px; opacity: 0.7; animation-delay: 0s; }
  .p2  { top: 15%; left: 6%;  width: 3px;  height: 3px; opacity: 0.5; animation-delay: 3s; }
  .p3  { top: 22%; right: 8%; width: 6px;  height: 6px; opacity: 0.6; animation-delay: 1s; }
  .p4  { top: 35%; left: 4%;  width: 4px;  height: 4px; opacity: 0.55; animation-delay: 5s; }
  .p5  { top: 48%; right: 5%; width: 3px;  height: 3px; opacity: 0.5; animation-delay: 2s; }
  .p6  { top: 60%; left: 8%;  width: 5px;  height: 5px; opacity: 0.65; animation-delay: 6s; }
  .p7  { top: 72%; right: 10%; width: 4px; height: 4px; opacity: 0.55; animation-delay: 4s; }
  .p8  { bottom: 10%; left: 14%; width: 6px; height: 6px; opacity: 0.6; animation-delay: 7s; }
  .p9  { bottom: 20%; right: 12%; width: 3px; height: 3px; opacity: 0.5; animation-delay: 1.5s; }
  .p10 { bottom: 5%;  right: 20%; width: 4px; height: 4px; opacity: 0.55; animation-delay: 8s; }
  .p11 { top: 28%; left: 18%; width: 2px; height: 2px; opacity: 0.4; animation-delay: 9s; }
  .p12 { top: 55%; right: 18%; width: 2px; height: 2px; opacity: 0.4; animation-delay: 2.5s; }
  .p13 { bottom: 35%; left: 20%; width: 3px; height: 3px; opacity: 0.45; animation-delay: 4.5s; }
  .p14 { bottom: 45%; right: 8%; width: 5px; height: 5px; opacity: 0.6; animation-delay: 6.5s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(8px, -12px); }
  }

  /* Decorative palm silhouettes in background corners */
  .palm-deco {
    position: fixed;
    pointer-events: none;
    opacity: 0.08;
    z-index: 0;
  }
  .palm-deco.tl { top: -40px; left: -60px; width: 280px; transform: rotate(-20deg); }
  .palm-deco.br { bottom: -50px; right: -70px; width: 320px; transform: rotate(160deg); }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 28px 80px;
    position: relative;
    z-index: 10;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeUp 0.9s ease-out;
  }

  .logo {
    width: 280px;
    max-width: 85%;
    height: auto;
    margin: 0 auto 18px;
    display: block;
    filter: drop-shadow(0 10px 35px rgba(168, 105, 84, 0.18));
    animation: logoIn 1.2s ease-out;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  .name-arabic {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.4rem;
    color: var(--rg-deep);
    margin-bottom: 22px;
    letter-spacing: 0.06em;
  }

  /* Ornamental divider — three dots flanked by thin gold lines */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 18px 0 14px;
  }
  .divider::before, .divider::after {
    content: '';
    height: 1px;
    width: 70px;
    background: linear-gradient(90deg, transparent, var(--rg-mid), transparent);
  }
  .divider-dots {
    display: flex;
    gap: 6px;
  }
  .divider-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--rg-mid);
    box-shadow: 0 0 6px rgba(192, 135, 112, 0.4);
  }
  .divider-dots span:nth-child(2) {
    width: 7px;
    height: 7px;
    background: var(--rg-deep);
  }

  .tagline {
    font-family: 'Allura', cursive;
    font-size: 2rem;
    color: var(--rg-deep);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  /* Section label */
  .section-label {
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--rg-mid);
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px;
    background: rgba(255, 251, 246, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(192, 135, 112, 0.25);
    border-radius: 18px;
    text-decoration: none;
    color: var(--ink);
    box-shadow:
      0 4px 18px rgba(168, 105, 84, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.7s ease-out forwards;
  }
  .link-card:nth-child(1) { animation-delay: 0.15s; }
  .link-card:nth-child(2) { animation-delay: 0.27s; }
  .link-card:nth-child(3) { animation-delay: 0.39s; }
  .link-card:nth-child(4) { animation-delay: 0.51s; }
  .link-card:nth-child(5) { animation-delay: 0.63s; }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(232,185,163,0.3) 0%, rgba(240,224,210,0.5) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 0;
  }

  .link-card:hover {
    transform: translateY(-3px);
    box-shadow:
      0 12px 30px rgba(168, 105, 84, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border-color: var(--rg-mid);
  }
  .link-card:hover::before { opacity: 1; }
  .link-card > * { position: relative; z-index: 1; }

  .icon-wrap {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--rg-light) 0%, var(--rg-mid) 100%);
    box-shadow:
      0 3px 10px rgba(168, 105, 84, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .icon-wrap svg { width: 24px; height: 24px; }

  .link-text { flex: 1; min-width: 0; }
  .link-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .link-handle {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--rg-deep);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  .arrow {
    color: var(--rg-mid);
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }
  .link-card:hover .arrow {
    transform: translateX(4px);
    color: var(--rg-deep);
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 60px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.8s forwards;
  }
  .footer-text {
    font-family: 'Allura', cursive;
    color: var(--rg-deep);
    font-size: 1.5rem;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .footer-mark {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--rg-mid);
    opacity: 0.5;
    text-transform: uppercase;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 400px) {
    .container { padding: 40px 20px 60px; }
    .logo { width: 230px; }
    .tagline { font-size: 1.7rem; }
    .link-card { padding: 14px 18px; gap: 14px; }
    .icon-wrap { width: 44px; height: 44px; }
    .icon-wrap svg { width: 22px; height: 22px; }
    .link-label { font-size: 1.2rem; }
  }
</style>
</head>
